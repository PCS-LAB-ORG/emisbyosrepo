[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "byob_core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34",
    "azure-mgmt-security>=7.0",
    "azure-mgmt-resourcegraph>=8.0",
    "azure-identity>=1.16",
    "azure-keyvault-secrets>=4.8",
    "tenacity>=8.3",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "responses>=0.25",
    "moto[inspector2,secretsmanager]>=5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["byob_core*"]
